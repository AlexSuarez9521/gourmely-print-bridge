name: Cert Renewal

# Renews the Let's Encrypt cert for localhost.gourmelyhub.busticco.com,
# embeds the new pem files in src-tauri/certs/, bumps the patch version,
# and opens a pull request against main. Merging the PR + tagging
# `v<new-version>` re-triggers the release pipeline so every customer
# gets the new cert via the next installer update (or the Tauri
# auto-updater).
#
# Let's Encrypt certs are valid 90 days. This runs MONTHLY and renews only
# when fewer than RENEW_WINDOW_DAYS remain, so a single failed run is never
# fatal: there are two more attempts inside the window.
#
# WHY IT IS WRITTEN THIS WAY (2026-08-13). Until today this workflow had never
# issued a real certificate. The scheduled run of 2026-07-01 failed with nobody
# watching, and the only "success" on record was a `--dry-run`. When it was
# finally run for real, certbot DID get the cert — and the very next step threw
# it away, because `[ -f ... ]` cannot see inside certbot's 0700 root-owned
# `live/` directory. The dry run skips that step, so the one path that mattered
# was the only one never exercised. Both things are fixed here; the lesson is
# that a dry run of a pipeline is not a test of the pipeline.
#
# Required secrets:
#   - CLOUDFLARE_DNS_API_TOKEN : token with Zone:Read + DNS:Edit scope
#                                limited to the busticco.com zone.
# (CERT_RENEWAL_PR_TOKEN is NO LONGER used: it was a PAT that expired silently
#  and broke checkout. The job's own GITHUB_TOKEN cannot expire.)

on:
  schedule:
    # MONTHLY, at 03:00 UTC — and the job exits early unless the shipped cert
    # has less than RENEW_WINDOW_DAYS left, so this is not a monthly release.
    #
    # It used to run every 60 days. That gives ONE attempt per cycle, and on
    # 2026-07-01 that attempt failed (the Cloudflare secret was missing) with
    # nobody watching: the next one was due 2026-09-01, five days before the
    # cert expired. A schedule where a single silent failure can take a
    # restaurant's printing offline is not a schedule, it is a coin flip.
    # Monthly gives two spare attempts inside the renewal window.
    - cron: "0 3 1 * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "If true, run certbot in --dry-run mode (no real cert issued)."
        required: false
        default: "false"
        type: string
      force:
        description: "If true, renew even when the shipped cert still has plenty of time left."
        required: false
        default: "false"
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: cert-renewal
  cancel-in-progress: false

env:
  DOMAIN: "localhost.gourmelyhub.busticco.com"
  CERT_EMAIL: "alexsuarez9521@gmail.com"
  # Renew when the shipped cert has less than this left. Let's Encrypt issues
  # for 90 days, so 45 leaves three monthly attempts inside the window.
  RENEW_WINDOW_DAYS: "45"

jobs:
  renew:
    name: Renew Let's Encrypt cert
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # GITHUB_TOKEN, not a PAT. CERT_RENEWAL_PR_TOKEN expired at some point
      # before 2026-07-30 and, because the secret still existed, the `||` never
      # fell through: checkout died with "could not read Username for
      # 'https://github.com'" and the renewal never even installed certbot. The
      # job's own token cannot expire; a PAT is a credential someone has to
      # remember to renew, which is exactly what did not happen.
      #
      # Accepted trade-off: a PR opened with GITHUB_TOKEN does not trigger other
      # workflows, so ci.yml will not run on the renewal PR. That PR only changes
      # two .pem files and the version; whoever merges it can dispatch CI by hand,
      # and release.yml compiles everything from the tag right after.
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      # Corre todos los meses, pero solo RENUEVA cuando de verdad hace falta:
      # así una ejecución fallida no es fatal (quedan más intentos dentro de la
      # ventana) y tampoco se publica una versión nueva cada mes sin motivo.
      - name: ¿Hace falta renovar?
        id: check
        run: |
          CERT="src-tauri/certs/fullchain.pem"
          if [ "${{ inputs.force }}" = "true" ]; then
            echo "Forzado a mano." && echo "renovar=true" >> "$GITHUB_OUTPUT" && exit 0
          fi
          if [ ! -f "$CERT" ]; then
            echo "No hay certificado en el repo todavía." && echo "renovar=true" >> "$GITHUB_OUTPUT" && exit 0
          fi
          FIN_TS=$(date -d "$(openssl x509 -enddate -noout -in "$CERT" | cut -d= -f2)" +%s)
          DIAS=$(( (FIN_TS - $(date +%s)) / 86400 ))
          echo "El certificado del repo caduca en $DIAS día(s) (ventana: $RENEW_WINDOW_DAYS)."
          if [ "$DIAS" -le "$RENEW_WINDOW_DAYS" ]; then
            echo "renovar=true" >> "$GITHUB_OUTPUT"
          else
            echo "renovar=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Todavía quedan $DIAS días; no se renueva. Usa force=true para forzarlo."
          fi

      - name: Install certbot + Cloudflare DNS plugin
        if: steps.check.outputs.renovar == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y certbot python3-certbot-dns-cloudflare

      - name: Write Cloudflare credentials
        if: steps.check.outputs.renovar == 'true'
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_DNS_API_TOKEN }}
        run: |
          if [ -z "$CF_TOKEN" ]; then
            echo "::error::CLOUDFLARE_DNS_API_TOKEN secret is not set"
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/cf"
          chmod 700 "$RUNNER_TEMP/cf"
          cat > "$RUNNER_TEMP/cf/credentials.ini" <<EOF
          dns_cloudflare_api_token = $CF_TOKEN
          EOF
          chmod 600 "$RUNNER_TEMP/cf/credentials.ini"

      - name: Issue / renew cert via DNS-01
        if: steps.check.outputs.renovar == 'true'
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          mkdir -p "$RUNNER_TEMP/le"
          DRY_FLAG=""
          if [ "$DRY_RUN" = "true" ]; then
            DRY_FLAG="--dry-run"
          fi
          sudo certbot certonly \
            --non-interactive \
            --agree-tos \
            --email "$CERT_EMAIL" \
            --dns-cloudflare \
            --dns-cloudflare-credentials "$RUNNER_TEMP/cf/credentials.ini" \
            --dns-cloudflare-propagation-seconds 30 \
            --config-dir "$RUNNER_TEMP/le/config" \
            --work-dir "$RUNNER_TEMP/le/work" \
            --logs-dir "$RUNNER_TEMP/le/logs" \
            -d "$DOMAIN" \
            $DRY_FLAG

      - name: Copy new cert into the bridge
        if: steps.check.outputs.renovar == 'true' && inputs.dry_run != 'true'
        run: |
          LIVE_DIR="$RUNNER_TEMP/le/config/live/$DOMAIN"
          # `sudo test`, not `test`. certbot runs under sudo, so it leaves
          # `live/` as 0700 root:root — the runner user cannot even stat what is
          # inside. The plain `[ -f ... ]` therefore reported "no cert files" on
          # a run where certbot had just printed "Successfully received
          # certificate", and the job threw away a real 90-day cert with a
          # message blaming certbot. The dry run never caught it because
          # `--dry-run` skips this step entirely: the only path that mattered
          # was the only one nobody exercised.
          if ! sudo test -f "$LIVE_DIR/fullchain.pem" || ! sudo test -f "$LIVE_DIR/privkey.pem"; then
            echo "::error::certbot did not produce live cert files at $LIVE_DIR"
            sudo ls -la "$LIVE_DIR" || true
            exit 1
          fi
          sudo cp "$LIVE_DIR/fullchain.pem" src-tauri/certs/fullchain.pem
          sudo cp "$LIVE_DIR/privkey.pem"   src-tauri/certs/privkey.pem
          sudo chown "$(id -u):$(id -g)" src-tauri/certs/*.pem

      - name: Bump bridge patch version
        id: bump
        if: steps.check.outputs.renovar == 'true' && inputs.dry_run != 'true'
        # The version lives in THREE files. This step used to bump two of them,
        # which is how Cargo.lock ended up at 0.1.1 while both manifests said
        # 0.1.2. It also re-serialised tauri.conf.json with `json.dumps`, whose
        # default `ensure_ascii=True` rewrote the installer's shortDescription
        # and copyright as — / © on every run.
        #
        # `ops/bump-version.py` does all three with a targeted replacement, and
        # it is a real file so it can be run and tested outside CI — unlike
        # inline shell, which only ever executes months later when the cert is
        # already about to expire.
        run: |
          set -euo pipefail
          OLD=$(python3 ops/bump-version.py --check | grep '^tauri.conf.json:' | cut -d' ' -f2)
          NEW=$(python3 ops/bump-version.py --patch)
          echo "old=$OLD" >> "$GITHUB_OUTPUT"
          echo "new=$NEW" >> "$GITHUB_OUTPUT"

      - name: Open pull request
        if: steps.check.outputs.renovar == 'true' && inputs.dry_run != 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base: main
          branch: ci/cert-renewal
          delete-branch: true
          commit-message: "chore: renew TLS cert and bump to v${{ steps.bump.outputs.new }}"
          title: "chore: renew TLS cert + bump to v${{ steps.bump.outputs.new }}"
          body: |
            Automated Let's Encrypt cert renewal for `${{ env.DOMAIN }}`.

            - New cert lives at `src-tauri/certs/`
            - Bridge version bumped: `${{ steps.bump.outputs.old }}` → `${{ steps.bump.outputs.new }}`

            After merge: tag `v${{ steps.bump.outputs.new }}` to trigger the release pipeline so every customer gets the new cert in the next installer / auto-update.
          labels: |
            automated

      - name: Cleanup credentials
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/cf" "$RUNNER_TEMP/le" || true
